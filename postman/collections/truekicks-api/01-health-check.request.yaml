$kind: http-request
name: Health Check
method: GET
url: '{{base_url}}/'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Health check returns 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Response confirms TrueKicks server running', () => {
        pm.expect(pm.response.text()).to.include('TrueKicks');
      });
