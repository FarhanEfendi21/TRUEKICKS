$kind: http-request
name: Get Apparel Catalog
method: GET
url: '{{base_url}}/api/apparel'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Returns non-empty apparel array', () => {
        const data = pm.response.json();
        pm.expect(data).to.be.an('array').and.not.be.empty;
        pm.expect(data[0]).to.have.property('name');
      });
