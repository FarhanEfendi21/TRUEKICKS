$kind: http-request
name: 'Tier 1: Admin Delete Promo Coupon Cleanup (DELETE)'
method: DELETE
url: '{{base_url}}/api/admin/coupons/{{created_coupon_id}}'
order: 44000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('DELETE /api/admin/coupons/:id returns 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Confirms deleted coupon code matches TKADMIN99', () => {
        const body = pm.response.json();
        pm.expect(body.deleted.code).to.equal('TKADMIN99');
      });
